apis:
  - name: iX Hello Customer v2 Universal Messaging API
    description: >-
      Headless flow-execution API for iX Hello Customer v2. Starts a stateful conversational
      session against an authored flow, sends user turns into it, reads accumulated session
      variables, and terminates the session — all over REST, with no chat or voice front end
      attached. Injects context variables at session start, returns the flow's messages and wait
      state on every turn, and correlates back to the caller's own system through an opaque
      metadata block. Organization-scoped bearer API keys; sessions live at most one hour.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/concentrix.png
    humanURL: https://docs.ixhello.com/ixhc2/integrations/executing-flow-via-api-headless-execution/universal-messaging-api
    baseURL: https://api.vnext.ixhello.com
    tags:
      - AI Agents
      - Conversational AI
      - Customer Experience
      - Chatbots
      - Workflow Automation
      - Contact Center
