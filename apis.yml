  - name: iX Hello Customer v2 Outbound Calling API
    description: >-
      Places outbound PSTN and SIP voice calls programmatically and runs an authored iX Hello flow
      on the call. Three result-delivery modes — synchronous (connection held to a 30 second
      gateway timeout), polling, and signed webhook callbacks on call.answered / call.failed /
      call.completed. Optional answering-machine detection gates whether a flow session is created
      at all. Organization-scoped bearer API keys; two operations, initiate and get status.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/concentrix.png
    humanURL: https://docs.ixhello.com/ixhc2/integrations/outbound-calling-api-user-guide
    baseURL: https://api.vnext.ixhello.com
