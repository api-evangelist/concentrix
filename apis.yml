description: >-
  Concentrix is a global technology and services company delivering customer experience
  management, digital transformation and technology consulting for roughly 2,000 brands. Its
  product line is the iX suite — iX Hello (customer- and employee-facing AI assistants), iX Hero
  (an agent desktop) and iX Hello Customer v2 (a flow-based conversational platform) — alongside
  Catalyst, its experience and engineering consultancy. iX Hello Customer v2 is the one genuinely
  callable surface: Concentrix publishes REST APIs on api.vnext.ixhello.com for headless flow
  execution, stateful conversational sessions and programmatic outbound PSTN/SIP calling, with
  signed webhook callbacks, documented at docs.ixhello.com. There is no OpenAPI, no SDK, no
  self-service signup and no published pricing — keys are issued per organization by the product
  team, so the API is real but sales-gated.
