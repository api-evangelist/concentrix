note: >-
  Concentrix documents that the iX Hello Customer v2 APIs are throttled — a 429 with code
  RATE_LIMIT_EXCEEDED, "API Gateway request throttle exceeded" — but publishes no numeric limit,
  no window, no burst allowance, and no rate-limit response headers. An integrator cannot size a
  workload or back off intelligently from the published documentation; they can only observe the
  429. Recorded as an honest zero rather than omitted.
