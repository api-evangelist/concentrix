note: >-
  Concentrix ships NO MCP server. iX Hello Customer v2 is an MCP *client*: its Integrations page
  has an MCP connection type that points at somebody else's MCP endpoint, it browses
  registry.modelcontextprotocol.io to find servers, it runs OAuth against them, and it
  auto-generates two fixed internal methods (List Tools, Execute Tool) per connection so a flow's
  Tools node can call another vendor's tools. That is consumption, not publication — the direction
  matters and the catalog should not read it as an agent surface Concentrix offers.
  No candidate tool list is derived either: there is no OpenAPI in this repo to ground one in, and
  inventing tool names from prose would misrepresent both the tools and their input schemas.
