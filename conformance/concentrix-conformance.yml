  - id: rfc6750-bearer-token
    conforms: true
    evidence: 'iX Hello Customer v2 APIs require "Authorization: Bearer <api_key>" on every endpoint.'
  - id: rfc2104-hmac
    conforms: true
    evidence: Webhook callbacks carry X-Signature; sha256=<hex> computed as HMAC-SHA256(webhookAuth, rawRequestBody).
