      selected server, and auto-generated List Tools / Execute Tool methods bound to a Flow
      Designer Tools node. Concentrix does NOT publish an MCP server; see mcp/concentrix-mcp.yml.
    docs: https://docs.ixhello.com/ixhc2/integrations/mcp
